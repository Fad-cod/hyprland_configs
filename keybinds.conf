# Keybinds overrides — remplace certains binds par défaut d'Ambxst
# Ambxst source sa base depuis ~/.local/share/ambxst/hyprland.conf

# Launcher — déjà géré par ambxst (bind = SUPER, Super_L, exec, ambxst run launcher)

# Supprime les binds ambxst conflictuels (sourcé avant ce fichier)
unbind = SUPER, C                # ambxst: killactive → on veut code ici
unbind = SUPER, L                # ambxst: loginctl lock-session → remplacé par ambxst lock

# Apps
bind = $kbTerminal, exec, $terminal
bind = $kbBrowser, exec, $browser
bind = $kbEditor, exec, $editor
bind = Super, G, exec, nice -n -5 github-desktop
bind = $kbFileExplorer, exec, $fileExplorer
bind = Super+Alt, E, exec, nice -n -5 nemo
bind = Ctrl+Alt, Escape, exec, nice -n -5 qps
bind = Ctrl+Alt, V, exec, pavucontrol

# Colour picker (ambxst utilise Super+Shift+C pour config)
bind = Super+Shift, H, exec, hyprpicker -a

# Volume — ambxst gère +10%, on garde juste le mic mute
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Lock (remplace le loginctl d'Ambxst par ambxst lock)
bind = $kbLock, exec, ambxst lock

# Sleep
bindl = Super+Shift, L, exec, systemctl suspend-then-hibernate

# Power profiles (pas dans ambxst)
bind = Super, F10, exec, powerprofilesctl set power-saver && hyprctl keyword monitor eDP-1,1366x768@40,0x0,1 && sudo systemctl stop avahi-daemon && [ -f /sys/class/leds/*::kbd_backlight/brightness ] && echo 0 | sudo tee /sys/class/leds/*::kbd_backlight/brightness && notify-send "Alimentation" "Mode Ultra-Économie (40Hz + Avahi OFF) activé" -i battery-low
bind = Super, F11, exec, powerprofilesctl set balanced && hyprctl keyword monitor eDP-1,1366x768@60,0x0,1 && sudo systemctl start avahi-daemon && notify-send "Alimentation" "Mode Équilibré (60Hz + Avahi ON) activé" -i battery-full
bind = Super, F12, exec, powerprofilesctl set performance && hyprctl keyword monitor eDP-1,1366x768@60,0x0,1 && sudo systemctl start avahi-daemon && notify-send "Alimentation" "Mode Performance (60Hz + Avahi ON) activé" -i power-profile-performance

# Utilitaires
bind = Ctrl+Shift, Escape, exec, nice -n -5 foot --app-id btop btop
binde = $kbPrevWs, workspace, -1
binde = $kbNextWs, workspace, +1
binde = Super, Page_Up, workspace, -1
binde = Super, Page_Down, workspace, +1
bind = Super+Alt, Page_Up, movetoworkspace, -1
bind = Super+Alt, Page_Down, movetoworkspace, +1
bindl = Ctrl+Shift+Alt, V, exec, sleep 0.5s && ydotool type -d 1 "$(cliphist list | head -1 | cliphist decode)"

# Gestion fenêtres
bind = $kbCloseWindow, killactive
bind = Super, O, exec, ~/.config/hypr/scripts/toggle_class_opacity.sh

# Sleep toggle (inhibition veille)
bind = Super+Ctrl, B, exec, ~/.config/hypr/scripts/toggle-sleep.sh



# ═══ MOUSE KEYS (pavé numérique) ═══
exec-once = sudo python3 /usr/local/bin/mousekeys-daemon.py
bindd = , KP1, exec, echo "m -1 1" | sudo tee /tmp/mousekeys_pipe >/dev/null
bindd = , KP2, exec, echo "m 0 1" | sudo tee /tmp/mousekeys_pipe >/dev/null
bindd = , KP3, exec, echo "m 1 1" | sudo tee /tmp/mousekeys_pipe >/dev/null
bindd = , KP4, exec, echo "m -1 0" | sudo tee /tmp/mousekeys_pipe >/dev/null
bindd = , KP5, exec, echo "c" | sudo tee /tmp/mousekeys_pipe >/dev/null
bindd = , KP6, exec, echo "m 1 0" | sudo tee /tmp/mousekeys_pipe >/dev/null
bindd = , KP7, exec, echo "m -1 -1" | sudo tee /tmp/mousekeys_pipe >/dev/null
bindd = , KP8, exec, echo "m 0 -1" | sudo tee /tmp/mousekeys_pipe >/dev/null
bindd = , KP9, exec, echo "m 1 -1" | sudo tee /tmp/mousekeys_pipe >/dev/null
bindd = , KP0, exec, echo "c" | sudo tee /tmp/mousekeys_pipe >/dev/null
bindd = , KPDOT, exec, echo "r" | sudo tee /tmp/mousekeys_pipe >/dev/null

# ═══ JARVIS ═══
bind = Super, J, exec, foot --app-id jarvis ~/.venv-jarvis/bin/python ~/jarvis/jarvis.py
bind = Super+Shift, J, exec, ~/.venv-jarvis/bin/python ~/jarvis/jarvis.py --web & sleep 1 && xdg-open http://localhost:8080

# ############# Themes #############
# Force GTK3 theming pour Qt/KDE apps → adw-gtk3-dark
env = QT_QPA_PLATFORMTHEME, gtk3
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = XCURSOR_THEME, $cursorTheme
env = XCURSOR_SIZE, $cursorSize

# ######## Toolkit backends ########
env = GDK_BACKEND, wayland,x11
env = QT_QPA_PLATFORM, wayland
env = SDL_VIDEODRIVER, wayland,x11,windows
env = CLUTTER_BACKEND, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto

# ####### XDG specifications #######
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = XDG_PICTURES_DIR, $HOME/Images
env = XDG_VIDEOS_DIR, $HOME/Vidéos
env = XDG_DOCUMENTS_DIR, $HOME/Documents
env = XDG_DOWNLOAD_DIR, $HOME/Téléchargements
env = XDG_MUSIC_DIR, $HOME/Musique
env = XDG_TEMPLATES_DIR, $HOME/Modèles
env = XDG_PUBLICSHARE_DIR, $HOME/Public
env = XDG_DESKTOP_DIR, $HOME/Bureau

# ############# Others #############
env = _JAVA_AWT_WM_NONREPARENTING, 1

# ############# GPU (Vulkan partout) #############
env = GBM_BACKEND, drm
env = LIBVA_DRIVER_NAME, radeonsi
env = VDPAU_DRIVER, radeonsi
env = MESA_VK_WSI_PRESENT_MODE, mailbox
env = RADV_PERFTEST, aco

# ############# Firefox #############
env = MOZ_ENABLE_WAYLAND, 1
env = MOZ_DISABLE_RDD_SANDBOX, 1

# ############# Qt/Quickshell (OpenGL — Vulkan non supporté par QuickShell sur Stoney) #############
env = QSG_RENDER_LOOP, threaded
env = QSG_BACKEND, opengl
env = QT_QUICK_BACKEND, opengl
env = NIXOS_OZONE_WL, 1

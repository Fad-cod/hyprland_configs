# Keyring and auth
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# XDG Desktop Portals
exec-once = sleep 1 && systemctl --user restart xdg-desktop-portal xdg-desktop-portal-hyprland xdg-desktop-portal-gtk

# Clipboard history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Auto delete trash 30 days old
exec-once = trash-empty 30

# Cursors
exec-once = hyprctl setcursor $cursorTheme $cursorSize
exec-once = gsettings set org.gnome.desktop.interface cursor-theme '$cursorTheme'
exec-once = gsettings set org.gnome.desktop.interface cursor-size $cursorSize

# Location provider and night light
exec-once = /usr/lib/geoclue-2.0/demos/agent
exec-once = gammastep

# Forward bluetooth media commands to MPRIS
exec-once = mpris-proxy

# Axctl daemon (sécurité — ambxst le lance via AxctlService, mais au cas où)
exec-once = sleep 3 && axctl -c ~/.local/share/ambxst/axctl.toml daemon

# Watcher: met à jour les couleurs Hyprland quand le wallpaper change
exec-once = sleep 2 && ~/.config/hypr/scripts/scheme-watcher.sh

# Watcher: met à jour le bind Super+F selon le layout
exec-once = ~/.config/hypr/scripts/layout_bind_watcher.sh

# Nettoyage des sockets Wayland orphelins à la déconnexion
# Évite l'écran noir quand on switch vers KDE ou un autre DE
exec-shutdown = bash -c 'rm -f /run/user/$(id -u)/wayland-1 /run/user/$(id -u)/wayland-1.lock; rm -rf /run/user/$(id -u)/hypr'

$hypr = ~/.config/hypr
$hl = $hypr/hyprland

# Ambxst base config (keybinds, général, décorations, animations, layer rules)
source = ~/.local/share/ambxst/hyprland.conf

# Keyboard layout (override ambxst)
input {
    kb_layout = fr
}

# Variables (colours + other vars)
source = $hypr/variables.conf
source = $hypr/scheme/current.conf

# Default monitor conf
monitor = , preferred, auto, 1


# Configs
source = $hl/env.conf
source = $hl/general.conf
source = $hl/input.conf
source = $hl/misc.conf
source = $hl/animations.conf
source = $hl/decoration.conf
source = $hl/group.conf
source = $hl/execs.conf
source = $hl/rules.conf
source = $hl/opaque_classes.conf
source = $hl/gestures.conf
source = $hl/keybinds.conf
source = $hl/scrolling.conf
source = $hl/layout_bind.conf

# Window management (override ambxst defaults)
bind = Super+Alt, F, fullscreen, 0
bind = Super+Alt, Space, togglefloating,

env = MESA_SHADER_CACHE_DIR,$HOME/.cache/mesa_shader_cache




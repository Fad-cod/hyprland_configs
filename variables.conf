# ### Hyprland ###
# Apps (sans nice négatif : refusé sans privilèges, et $browser pointait vers un binaire inexistant)
$terminal = kitty
$browser = chromium
$editor = code
$fileExplorer = dolphin

# Touchpad
$touchpadDisableTyping = true
$touchpadScrollFactor = 1
$workspaceSwipeFingers = 4
$gestureFingers = 3
$gestureFingersMore = 4

# Blur
$blurEnabled = true
$blurSpecialWs = false
$blurPopups = false
$blurInputMethods = false
$blurXray = false
$blurSize = 2
$blurPasses = 2

# Shadow
$shadowEnabled = true
$shadowRange = 4
$shadowRenderPower = 1
$shadowColour = rgba($surfaced4)

# Gaps (espace confortable entre fenêtres)
$workspaceGaps = 1
$windowGapsIn = 2
$windowGapsOut = 2
$singleWindowGapsOut = 2

# Window styling
$windowOpacity = 1.0
$windowRounding = 20

$windowBorderSize = 02
$activeWindowBorderColour = rgba($primarye6)
$inactiveWindowBorderColour = rgba($onSurfaceVariant11)

# Opacity color variants (dérivés du Material You scheme)
$primarye6 = ffb3aee6
$onSurfaceVariant11 = d8c2bf11
$surfaced4 = 080303d4
$primaryd4 = ffb3aed4
$outlined4 = a08c8ad4
$secondaryd4 = e7bdb9d4

# Misc
$volumeStep = 01 # In percent
$cursorTheme = sweet-cursors
$cursorSize = 24


# ### Keybinds ###
# Workspaces
$kbMoveWinToWs = Super+Alt
$kbMoveWinToWsGroup = Ctrl+Super+Alt
$kbGoToWs = Super
$kbGoToWsGroup = Ctrl+Super

$kbNextWs = Ctrl+Super, right
$kbPrevWs = Ctrl+Super, left

$kbToggleSpecialWs = Super, S

# Window groups
$kbWindowGroupCycleNext = Alt, Tab
$kbWindowGroupCyclePrev = Shift+Alt, Tab
$kbUngroup = Super, U
$kbToggleGroup = Super, Comma

# Window actions
$kbMoveWindow = Super, Z
$kbResizeWindow = Super, X
$kbPinWindow = Super, P
$kbWindowFullscreen = Super+Alt, F
$kbWindowBorderedFullscreen = Super, F
$kbToggleWindowFloating = Super+Alt, Space
$kbCloseWindow = Super, Q

# Special workspace toggles
$kbMusic = Super, M
$kbCommunication = Super, D
$kbTodo = Super, R

# Apps
$kbTerminal = Super, T
$kbBrowser = Super, W
$kbEditor = Super, C
$kbFileExplorer = Super, E

# Misc
$kbSession = Ctrl+Alt, Delete
$kbLock = Super, L
$kbRestoreLock = Super+Alt, L
